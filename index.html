<!DOCTYPE html>
<html lang="en">
   <head>
      <meta charset="utf-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1" />

      <!-- Bootstrap CSS -->
      <link
         href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
         rel="stylesheet"
         integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3"
         crossorigin="anonymous"
      />
      <!-- CSS -->
      <link rel="stylesheet" href="index.css" />

      <!-- FONT -->
      <link rel="preconnect" href="https://fonts.googleapis.com" />
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
      <link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet" />
      <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap" rel="stylesheet" />
   </head>

   <body>
      <header>
         <!-- Logo -->
         <section class="hero-section">
            <div class="container-fluid p-0">
               <div class="row m-0">
                  <div class="col-auto p-0">
                     <img class="logo" src="assets/Logo.svg" alt="LES PETITS PLATS" />
                  </div>
               </div>
            </div>

            <div class="container">
               <div class="row">
                  <div class="col-12 text-center">
                     <h1 class="hero-title">CHERCHEZ PARMI PLUS DE 1500 RECETTES<br />DU QUOTIDIEN, SIMPLES ET DÉLICIEUSES</h1>

                     <!-- Search Bar -->
                     <div class="search-container">
                        <input
                           id="search-input"
                           type="text"
                           class="form-control search-input"
                           placeholder="Rechercher une recette, un ingrédient..."
                        />
                        <button id="clear-btn" class="clear-btn" type="button" title="Effacer la recherche">&times;</button>
                        <button class="search-btn" type="button">
                           <svg width="20" height="20" fill="currentColor" viewBox="0 0 16 16">
                              <path
                                 d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001c.03.04.062.078.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1.007 1.007 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0z"
                              />
                           </svg>
                        </button>
                     </div>
                  </div>
               </div>
            </div>
         </section>
      </header>
      <main>
         <div class="container my-4">
            <div class="d-flex justify-content-between align-items-center flex-wrap gap-3">
               <!-- Groupe dropdowns -->
               <div class="d-flex gap-5 flex-wrap">
                  <div id="ingredient" data-type="Ingrédients" data-id="SearchableDropdownIngredient" class="dropdown-container"></div>
                  <div id="ustensils" data-type="Ustensiles" data-id="SearchableDropdownUstensils" class="dropdown-container"></div>
                  <div id="appliance" data-type="Appareils" data-id="SearchableDropdownAppliance" class="dropdown-container"></div>
               </div>

               <!-- Compteur -->
               <span class="fw-bold" id="recipe-count">1500 recettes</span>
            </div>
         </div>

         <!-- Tags -->
         <div class="container my-3">
            <div id="active-filters" class="d-flex flex-wrap"></div>
         </div>

         <!-- CARDS CONTAINER -->
         <div class="container mt-4">
            <div id="card-container" class="row card-container"></div>
         </div>
      </main>
      <!-- Bootstrap JS -->
      <script
         src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"
         integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p"
         crossorigin="anonymous"
      ></script>
      <script type="module" src="src/index.js"></script>
   </body>
</html>
