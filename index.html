<!doctype html>
<html lang="en">
  <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">

      <!-- Bootstrap CSS -->
      <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
      <!-- CSS -->

  <body>
   <header>
      <!-- Logo -->
      <section class="hero-section">
         <div class="container-fluid p-0">
            <div class="row m-0">
               <div class="col-auto p-0">
                  <img class="logo" src="assets/Logo.svg" alt="LES PETITS PLATS">
               </div>
            </div>
         </div>

         <!-- Contenu centré -->
         <div class="container">
            <div class="row">
               <div class="col-12 text-center">
                  <h1 class="hero-title">CHERCHEZ PARMI PLUS DE 1500 RECETTES<br>DU QUOTIDIEN, SIMPLES ET DÉLICIEUSES</h1>
                  
                  <!-- Search Bar -->
                  <div class="search-container">
                     <input type="text" class="form-control search-input" placeholder="Rechercher une recette, un ingrédient...">
                     <button class="search-btn" type="button">
                        <svg width="20" height="20" fill="currentColor" viewBox="0 0 16 16">

                        </svg>
                     </button>
                  </div>
               </div>
            </div>
         </div>
      </section>
      <!-- Bootstrap JS -->
      <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" crossorigin="anonymous"></script>
